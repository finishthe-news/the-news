version: 1

source:
  slug: abc-news
  name: ABC News
  owner_name: ABC News Internet Ventures
  source_type: public_reporting
  canonical_url: https://abcnews.com/

recipe:
  type: generic

discovery:
  feeds:
    - url: https://feeds.abcnews.com/abcnews/topstories
  allowed_hosts:
    article:
      - abcnews.com
    redirect:
      - abcnews.go.com
  update_strategy:
    mode: unseen_only

limits:
  article_cap: 25
  timeout_seconds: 600
  requests_per_minute: 6
  max_concurrency: 1

policy_proposal:
  status: draft
  access_method: public_rss
  endpoint_url: https://feeds.abcnews.com/abcnews/topstories
  terms_url: https://disneytermsofuse.com/english/
  robots_url: https://abcnews.com/robots.txt
  retention_days: 90
  allowed_uses:
    - discovery
    - internal_analysis
    - fact_extraction
    - temporary_storage
  attribution: Credit and link ABC News when its reporting identifies a candidate story.
  notes: >-
    ABC publishes the Top Stories feed for news aggregators. Disney's current
    terms restrict automated extraction and AI-related use without express
    written permission. Robert Ritz approved this bounded collection for
    discovery, private analysis, fact extraction, and original reporting under
    the project's fair-use operating position. Revisit the policy before public
    commercial launch.
