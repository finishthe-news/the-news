version: 1

source:
  slug: christian-science-monitor
  name: The Christian Science Monitor
  owner_name: The Christian Science Publishing Society
  source_type: public_reporting
  canonical_url: https://www.csmonitor.com/

recipe:
  type: builtin
  id: chr_mon.recipe

discovery:
  feeds:
    - url: https://rss.csmonitor.com/feeds/usa
    - url: https://rss.csmonitor.com/feeds/politics
    - url: https://rss.csmonitor.com/feeds/world
  allowed_hosts:
    article:
      - www.csmonitor.com
    redirect:
      - csmonitor.com
  update_strategy:
    mode: unseen_only

limits:
  article_cap: 10
  timeout_seconds: 600
  requests_per_minute: 6
  max_concurrency: 1

policy_proposal:
  status: draft
  access_method: public_rss
  endpoint_url: https://rss.csmonitor.com/feeds/usa
  terms_url: https://www.csmonitor.com/About/Terms
  robots_url: https://www.csmonitor.com/robots.txt
  retention_days: 90
  allowed_uses:
    - discovery
    - internal_analysis
    - fact_extraction
    - temporary_storage
  attribution: Credit and link The Christian Science Monitor when its reporting identifies a candidate story.
  notes: >-
    The Monitor's current terms limit its RSS files to personal viewing or
    noncommercial sites providing hyperlinks and require written permission
    for other non-personal uses. Robert Ritz approved this bounded collection
    for discovery, private analysis, fact extraction, and original reporting
    under the project's fair-use operating position. Robots currently permits
    ordinary article paths with a one-second crawl delay. The pinned built-in
    recipe contains additional feeds, so the manifest-feed override must remain
    in force. Revisit the policy before public commercial launch.
